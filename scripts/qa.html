<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Production QA</title><style>body{margin:0;background:#303847;color:white;font:13px Arial}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10;background:#303847}button,select{padding:8px}iframe{border:0;background:white;display:block;margin:auto}pre{white-space:pre-wrap;padding:16px;background:#121b2a}#wrap{overflow:auto}</style></head><body><header><label>Width <select id="width"><option>1440</option><option>1280</option><option>768</option><option>390</option><option>320</option></select></label><label>Page <select id="route"><option value="/">Home</option><option value="/services/">Services</option><option value="/contact/">Contact</option><option value="/projects/">Work</option><option value="/projects/mindvault/">MindVault</option><option value="/projects/xprize/">XPRIZE</option><option value="/projects/yarden/">Yarden</option><option value="/projects/tchat/">T-Chat</option><option value="/projects/foundry/">Foundry</option><option value="/projects/crigenetics/">CRI Genetics</option><option value="/projects/nucleotide/">Nucleotide</option><option value="/projects/clicktool/">Clicktool</option><option value="/resume/">Résumé</option><option value="/missing/">404</option></select></label><label>Language <select id="language"><option value="en">English</option><option value="ja">日本語</option></select></label><button id="load">Load page</button><button id="audit">Audit page</button><button id="batch">Audit all pages</button><button id="down">Scroll down</button><button id="up">Top</button><span id="status">Ready</span></header><div id="wrap"><iframe id="site" title="Production site preview" width="1440" height="900" src="/react-gh-pages/#/"></iframe></div><pre id="results" aria-live="polite"></pre><script>
const frame=document.querySelector('#site'),out=document.querySelector('#results'),status=document.querySelector('#status');let reports=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function load(route){frame.width=document.querySelector('#width').value;const lang=document.querySelector('#language')?.value||'en';frame.src='/react-gh-pages/?qa='+Date.now()+(lang==='ja'?'&lang=ja':'')+'#'+route;await wait(1600);}
async function audit(){const w=frame.contentWindow,d=w.document;const a=await w.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}});const data={route:w.location.hash,width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,documentWidth:d.documentElement.scrollWidth,bodyWidth:d.body.scrollWidth,h1:[...d.querySelectorAll('h1')].map(e=>e.textContent),brokenImages:[...d.images].filter(e=>e.complete&&!e.naturalWidth).map(e=>e.src),violations:a.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),offenders:[...d.querySelectorAll('main *')].filter(e=>{let r=e.getBoundingClientRect();return r.width>0&&(r.right>w.innerWidth+2||r.left < -2)}).slice(0,15).map(e=>{let r=e.getBoundingClientRect();return {element:e.tagName+'.'+e.className,left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),scrollWidth:e.scrollWidth,clientWidth:e.clientWidth}})};reports.push(data);out.textContent=JSON.stringify(reports,null,2);status.textContent='Audit complete: '+data.violations.length+' violations';return data;}
document.querySelector('#load').onclick=()=>load(document.querySelector('#route').value);document.querySelector('#audit').onclick=audit;document.querySelector('#down').onclick=()=>frame.contentWindow.scrollBy({top:650,behavior:'instant'});document.querySelector('#up').onclick=()=>frame.contentWindow.scrollTo({top:0,behavior:'instant'});document.querySelector('#batch').onclick=async()=>{reports=[];for(const route of [...document.querySelector('#route').options].map(x=>x.value)){status.textContent='Checking '+route;await load(route);await audit();}status.textContent='All pages checked';};
</script></body></html>
